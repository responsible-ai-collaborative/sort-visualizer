<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- Concentrating: top-left -->
  <rect x="2"  y="2"  width="13" height="13" fill="#000f1f"/>
  <!-- Escalating: top-right -->
  <rect x="17" y="2"  width="13" height="13" fill="#011934"/>
  <!-- Receding: bottom-left -->
  <rect x="2"  y="17" width="13" height="13" fill="#898a8d"/>
  <!-- Mitigating: bottom-right -->
  <rect x="17" y="17" width="13" height="13" fill="#8aa6c0"/>
</svg>
